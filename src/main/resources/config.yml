# FotiaChat 配置文件
# 高级聊天管理插件

# 本地化设置
localization:
  # 玩家客户端语言不受支持、控制台消息或日志使用的默认语言
  # 可选: zh_CN, zh_TW, ja_JP, ko_KR, en_US, fr_FR, de_DE, it_IT, pt_PT, es_ES
  default-locale: zh_CN
  # 安装 FotiaTranslator 后由其统一决定玩家语言；未安装时使用上面的默认语言。
  # 缺少翻译键时在控制台输出一次警告
  warn-missing-translation: true

# 调试模式
# 开启后会输出更多日志信息
debug: false

# 数据存储设置
storage:
  # 存储类型: memory(内存) 或 mysql(数据库)
  # 使用mysql可以跨服同步玩家的频道和颜色设置
  type: memory
  # 数据库最多等待执行的任务数；满队列时拒绝新操作并提示，不阻塞主线程
  # 修改后重启生效
  task-queue-capacity: 4096
  # MySQL配置 (当type为mysql时使用)
  mysql:
    host: localhost
    port: 3306
    database: fotiachat
    username: root
    password: ''
    # 连接池大小
    pool-size: 10
    # 禁言和屏蔽缓存的跨服刷新间隔（秒）
    # 聊天发送只读取内存缓存，不会直接查询数据库
    cache-refresh-seconds: 5

# 聊天设置
chat:
  # 注意: 聊天格式在 channels.yml 中配置
  # 每个频道可以有独立的格式、悬浮文本和点击事件
  # 是否允许玩家在消息中使用颜色代码
  allow-color-codes: true
  # 玩家艾特设置（仅识别当前服务器在线玩家）
  mention:
    # 是否启用艾特功能
    enabled: true
    # 是否将消息中的完整玩家名自动识别为艾特；关闭后必须输入 @玩家名
    auto-detect-player-name: true
    # 艾特在聊天中的显示格式，支持 {player}（被艾特玩家）和 {sender}（发送者）
    display: "lang:mentions.display"
    # 鼠标悬停文本，支持 MiniMessage、旧颜色码、{player} 和 {sender}
    hover:
      - "lang:mentions.hover-player"
      - "lang:mentions.hover-sender"
    # 只有实际收到该频道消息的被艾特玩家才会播放提示音
    sound:
      enabled: true
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.2

# 禁言设置
mute:
  # 权限禁言功能
  # 拥有此权限的玩家将被禁言（无法发送聊天消息）
  # 留空则禁用此功能
  permission: ""

# 跨服通信设置
cross-server:
  # 是否启用跨服通信
  enabled: false
  # 通信类型: bungeecord 或 redis
  type: bungeecord
  # 当前服务器名称；每台服务器必须唯一
  server-name: server1
  # Redis配置（type为redis时使用）
  redis:
    host: localhost
    port: 6379
    password: ''
    channel: fotiachat:messages
    # 连接/读写超时（毫秒）及断线重连间隔；网络操作均在后台执行
    timeout-millis: 2000
    reconnect-delay-millis: 5000
    # 最多等待发布的消息数；满队列时拒绝新消息并限频告警
    publish-queue-capacity: 1024
    # 消息在队列中的最大等待时间（秒），防止重连后发送过时消息
    message-max-age-seconds: 60
