    chatignore: "/chatignore <player|list>"
    msg: "/msg <player> <message>"
    reply: "/reply <message>"
    mute: "/mute <player> <duration> [reason]"
    unmute: "/unmute <player>"
  fotiachat:
    help:
      header: "<!i><gradient:#FF6B6B:#4ECDC4>========== FotiaChat Help ==========</gradient>"
      reload: "<!i><gray>/fotiachat reload - Reload configuration"
      help: "<!i><gray>/fotiachat help - Show help"
      version: "<!i><gray>/fotiachat version - Show version information"
      channel: "<!i><gray>/channel [channel] - View or switch channel"
      chatcolor: "<!i><gray>/chatcolor [color] - Select chat color"
      msg: "<!i><gray>/msg <player> <message> - Send a private message"
      reply: "<!i><gray>/reply <message> - Reply to a private message"
      mute: "<!i><gray>/mute <player> <duration> [reason] - Mute a player"
      unmute: "<!i><gray>/unmute <player> - Unmute a player"
