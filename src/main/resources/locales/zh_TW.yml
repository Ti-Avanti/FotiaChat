      help: "<!i><gray>/fotiachat help - 顯示幫助"
      version: "<!i><gray>/fotiachat version - 顯示版本信息"
      channel: "<!i><gray>/channel [channel] - 查看或切換頻道"
      chatcolor: "<!i><gray>/chatcolor [color] - 選擇聊天顏色"
      msg: "<!i><gray>/msg <player> <message> - 發送私人訊息"
      reply: "<!i><gray>/reply <message> - 回覆私人訊息"
      mute: "<!i><gray>/mute <player> <duration> [reason] - 將玩家靜音"
      unmute: "<!i><gray>/unmute <player> - 取消玩家靜音"
      footer: "<!i><gradient:#FF6B6B:#4ECDC4>====================================</gradient>"
    version:
      header: "<!i><gradient:#FF6B6B:#4ECDC4>========== FotiaChat ==========</gradient>"
      version: "<!i><gray>版本：<white>{version}</white>"
      authors: "<!i><gray>作者：<white>{authors}</white>"
      api: "<!i><gray>API版本：<white>{api}</white>"
      crossserver-enabled: "<!i><gray>跨伺服器：<green>啟用</green> <white>({type})</white>"
      crossserver-disabled: "<!i><gray>跨伺服器：<red>殘障人士</red>"
      footer: "<!i><gradient:#FF6B6B:#4ECDC4>===============================</gradient>"

