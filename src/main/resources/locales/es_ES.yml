# FotiaChat Archivo de idioma inglés

# Prefijo de mensaje
prefix: "<!i><gradient:#FF6B6B:#4ECDC4>[FotiaChat]</gradient> "

# Mensajes generales
general:
  reload-success: "<!i><green>¡Configuración recargada exitosamente!"
  reload-failed: "<!i><red>No se pudo recargar la configuración: {error}"
  no-permission: "<!i><red>¡No tienes permiso para ejecutar este comando!"
  player-only: "<!i><red>¡Este comando solo puede ser ejecutado por jugadores!"
  invalid-args: "<!i><red>¡Argumentos inválidos! Uso: {usage}"
  player-not-found: "<!i><red>Jugador no encontrado: {player}"
  player-offline: "<!i><red>¡El jugador {player} no está en línea!"

# Mensajes relacionados con el chat
chat:
  muted: "<!i><red>¡Estás silenciado y no puedes enviar mensajes!"
  mute-expired: "<!i><green>Tu silencio ha caducado, ¡ahora puedes enviar mensajes!"
  cooldown: "<!i><red>¡Enviando mensajes demasiado rápido! ¡Espere {time} antes de volver a intentarlo!"
  empty-message: "<!i><red>¡No se puede enviar un mensaje vacío!"
  message-too-long: "<!i><red>¡El mensaje es demasiado largo! Longitud máxima: {max}"

# Mensajes de comando de administrador
admin:
  mute-success: "<!i><green>Reproductor silenciado {player} para {duration}"
  unmute-success: "<!i><green>¡Jugador no silenciado {player}!"
  not-muted: "<!i><yellow>¡El jugador {player} no está silenciado!"
  clear-chat: "<!i><gray>¡El chat ha sido borrado por {player}!"
  mute-exempt: "<!i><red>¡El jugador {player} tiene exención de silencio!"
  duration-permanent: "Permanente"

# Mensajes relacionados con el canal
channel:
  current: "<!i><gray>Tu canal actual:<white>{channel}</white>"
  switched: "<!i><green>Cambiado de canal:<white>{channel}</white>"
  not-found: "<!i><red>Canal no encontrado: {channel}"
  no-permission: "<!i><red>¡No tienes permiso para usar este canal!"
  list-header: "<!i><gray>Canales disponibles:"
  list-item: "<!i><gray>- <white>{channel}</white> ({shortcut})"

# Mensajes relacionados con el color
color:
  current: "<!i><gray>Tu color de chat actual: {color}"
  help: "<!i><gray>Uso: /chatcolor <colorID|list|reset>"
  set-success: "<!i><green>Color del chat establecido en: {color}"
  reset: "<!i><green>¡El color del chat se restablece a los valores predeterminados!"
  not-found: "<!i><red>Color no encontrado: {color}"
  no-permission: "<!i><red>No tienes permiso para usar el color: {color}"
  list-header: "<!i><gray>========== Colores disponibles =========="
  list-item: "<!i><gray>- {name} <dark_gray>({id})</dark_gray> {preview}"
  list-footer: "<!i><gray>======================================"
  no-colors-available: "<!i><yellow>¡No hay colores disponibles!"
  preview-text: "Texto de muestra"
  select-hover: "<!i><gray>Haga clic para seleccionar este color"

# Filtrar mensajes relacionados
filter:
  blocked: "<!i><red>¡Tu mensaje contiene palabras sensibles y ha sido bloqueado!"
  warning: "<!i><yellow>¡Utilice un lenguaje apropiado!"

# Mensajes relacionados con mensajes privados
privatemsg:
  format-sender: "<!i><gray>[<gold>Yo</gold> -> <white>{target}</white>]</gray> {message}"
  format-receiver: "<!i><gray>[<white>{sender}</white> -> <gold>Yo</gold>]</gray> {message}"
  self: "<!i><red>¡No puedes enviarte un mensaje privado a ti mismo!"
  no-reply-target: "<!i><red>¡Nadie a quien responder!"
  target-offline: "<!i><red>¡El jugador objetivo está desconectado!"
  target-ignoring: "<!i><red>¡Este jugador te está ignorando, mensaje no enviado!"
  socialspy-enabled: "<!i><green>¡Modo de espionaje social habilitado!"
  socialspy-disabled: "<!i><yellow>¡Modo de espionaje social desactivado!"
  socialspy-format: "<!i><dark_gray>[Espía]<gray>{sender}</gray> -> <gray>{target}</gray>:</dark_gray> {message}"

# Mensajes de comunicación entre servidores
crossserver:
  chat-format: "<!i><dark_gray>[{server}]</dark_gray> <gray>[{channel}]</gray> <white>{player}</white><gray>:</gray> {message}"
  broadcast-format: "<!i><dark_gray>[{server}]</dark_gray> <gold>{message}</gold>"

# Actualizar mensajes de verificación
update:
  available: "<!i><gold>Una nueva versión FotiaChat está disponible:<white>{latest}</white> <gray>(actual: {current})</gray>"
  release-url: "<!i><gray>Haga clic para ver la página de lanzamiento:<aqua>{url}</aqua>"
  release-hover: "<!i><yellow>Haga clic para abrir la página GitHub Release "
  console-available: "Una nueva versión FotiaChat está disponible: {latest} (actual: {current}) - {url}"
  console-latest: "FotiaChat está actualizado: {current}"
  console-failed: "Error en la verificación de actualización deFotiaChat : {reason}"

# Mensajes relacionados con anuncios
announcement:
  sent: "<!i><green>Anuncio enviado: {id}"
  not-found: "<!i><red>Anuncio no encontrado: {id}"
  broadcast-success: "<!i><green>¡Mensaje transmitido!"
  toggle-enabled: "<!i><green>¡Anuncios automáticos habilitados!"
  toggle-disabled: "<!i><yellow>¡Anuncios automáticos deshabilitados!"
  reloaded: "<!i><green>¡Configuración de anuncios recargada!"
  list-header: "<!i><gray>========== Lista de anuncios =========="
  list-item: "<!i><gray>- {id} [{status}] (intervalo: {interval}s)"
  usage-send: "<!i><red>Uso: /announcement send <ID>"
  usage-broadcast: "<!i><red>Uso: /announcement broadcast <message>"
  help-header: "<!i><gray>========== Ayuda de anuncio =========="
  help-send: "<!i><gray>/announcement send <ID> - Enviar anuncio específico"
  help-broadcast: "<!i><gray>/announcement broadcast <message> - Difundir mensaje personalizado"
  help-list: "<!i><gray>/announcement list - Listar todos los anuncios"
  help-toggle: "<!i><gray>/announcement toggle - Alternar anuncios automáticos"
  help-reload: "<!i><gray>/announcement reload - Recargar configuración de anuncio"
  usage-test: "<!i><red>Uso: /announcement test <ID> [jugador]"
  test-player-required: "<!i><red>La consola debe indicar un jugador conectado.</red>"
  help-test: "<!i><gray>/announcement test <ID> [jugador] - Probar condiciones"
  test-header: "<!i><gold>Prueba de condiciones del anuncio:</gold>"
  test-overall-pass: "<!i><green>Superada</green>"
  test-overall-fail: "<!i><red>Fallida</red>"
  test-entry-pass: "<!i><green>[OK]</green>"
  test-entry-fail: "<!i><red>[FALLO]</red>"
  test-no-conditions: "<!i><gray>Este anuncio no tiene condiciones adicionales.</gray>"
  status-enabled: "Habilitado"
  status-disabled: "Discapacitado"

# Mensajes del módulo premium
premium:
  not-installed: "<!i><red>¡Esta función requiere la instalación del módulo FotiaChat-Premium !"
  feature-disabled: "<!i><red>¡La función{feature} no está habilitada!"

# Mensajes de visualización del artículo
item-display:
  no-permission: "<!i><red>¡No tienes permiso para mostrar artículos!"
  view-no-permission: "<!i><red>¡No tienes permiso para ver el inventario de otros/enderchest!"
  snapshot-expired: "<!i><red>¡Esta instantánea ha caducado!"
  inventory-title: "<!i>Inventario de{player}"
  enderchest-title: "<!i>Enderpecho de{player}"

# Ignorar mensajes relacionados
ignore:
  added: "<!i><green>¡Ahora estás ignorando los mensajes de chat de {player}!"
  removed: "<!i><yellow>¡Ya no estás ignorando {player}!"
  self: "<!i><red>¡No puedes ignorarte a ti mismo!"
  list-header: "<!i><gray>========== Jugadores ignorados =========="
  list-item: "<!i><gray>- <white>{player}</white>"
  list-empty: "<!i><yellow>¡No estás ignorando a ningún jugador!"

mentions:
  display: "<!i><yellow><bold>@{player}</bold></yellow>"
  hover-player: "<!i><gray>Jugador:<white>{player}</white></gray>"
  hover-sender: "<!i><gray>Mencionado por<white>{sender}</white></gray>"

channels:
  common:
    player-display: "<!i><white>{player}</white>"
    player-hover: "<!i><gray>Jugador:<white>%player_name%</white></gray>"
    player-click: "<!i><gray>Haz clic para enviar un mensaje a este jugador.</gray>"
  global:
    name: "Mundial"
    display: "<!i><gray>[<white>Mundial</white>]</gray>"
    hover-name: "<!i><gray>Canal:<white>{channel}</white></gray>"
    hover-description: "<!i><gray>Chat público en todo el servidor</gray>"
  local:
    name: "locales"
    display: "<!i><gray>[<yellow>locales</yellow>]</gray>"
    hover-name: "<!i><yellow>Canal Local</yellow>"
    hover-description: "<!i><gray>Visible sólo para jugadores cercanos</gray>"
  admin:
    name: "administrador"
    display: "<!i><gray>[<red>administrador</red>]</gray>"
    hover-name: "<!i><red>Canal de administración</red>"
    hover-description: "<!i><gray>Sólo administradores</gray>"
    player-hover: "<!i><gray>Administrador:<red>%player_name%</red></gray>"
    player-click: "<!i><gray>Haga clic para ver la información del jugador</gray>"
  help:
    name: "Ayuda"
    display: "<!i><gray>[<aqua>Ayuda</aqua>]</gray>"
    hover-name: "<!i><aqua>Canal de ayuda</aqua>"
    hover-description: "<!i><gray>Haga preguntas y solicite ayuda</gray>"
    player-click: "<!i><aqua>Haz clic para ayudar a este jugador.</aqua>"

colors:
  white: "<!i><white>blanco</white>"
  gray: "<!i><gray>gris</gray>"
  red: "<!i><red>rojo</red>"
  green: "<!i><green>Verde</green>"
  blue: "<!i><blue>azul</blue>"
  yellow: "<!i><yellow>amarillo</yellow>"
  gold: "<!i><gold>oro</gold>"
  aqua: "<!i><aqua>aguamarina</aqua>"
  light-purple: "<!i><light_purple>rosa</light_purple>"
  sunset: "<!i><gradient:#FF6B6B:#FFE66D>Degradado del atardecer</gradient>"
  ocean: "<!i><gradient:#667eea:#764ba2>gradiente del océano</gradient>"
  forest: "<!i><gradient:#11998e:#38ef7d>Degradado del bosque</gradient>"
  fire: "<!i><gradient:#f12711:#f5af19>gradiente de fuego</gradient>"
  ice: "<!i><gradient:#74ebd5:#ACB6E5>gradiente de hielo</gradient>"
  rainbow: "<!i><rainbow>arcoiris</rainbow>"

command:
  usage:
    fotiachat: "/fotiachat <reload|help|version>"
    chatignore: "/chatignore <player|list>"
