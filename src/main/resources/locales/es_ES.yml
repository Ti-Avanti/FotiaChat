      msg: "<!i><gray>/msg <player> <message> - Enviar un mensaje privado"
      reply: "<!i><gray>/reply <message> - Responder a un mensaje privado"
      mute: "<!i><gray>/mute <player> <duration> [reason] - Silenciar a un jugador"
