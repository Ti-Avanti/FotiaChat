    reply: "/reply <message>"
    mute: "/mute <player> <duration> [reason]"
    unmute: "/unmute <player>"
  fotiachat:
    help:
      header: "<!i><gradient:#FF6B6B:#4ECDC4>========== FotiaChat Ayuda ==========</gradient>"
