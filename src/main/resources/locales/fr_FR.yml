  vip:
    message: "<!i><gold>[VIP]</gold> <yellow>Merci pour votre soutien ! Profitez de vos avantages.</yellow>"
    hover-title: "<!i><gold>Avantages VIP</gold>"
    hover-action: "<!i><gray>Cliquez pour voir les détails</gray>"
  event:
