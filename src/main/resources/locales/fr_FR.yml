    subtitle: "<!i><gray>       Passez un bon moment !</gray>"
  rules:
    civil: "<!i><yellow>[Astuce]</yellow> <gray>Veuillez suivre les règles du serveur et être respectueux !</gray>"
    cheating: "<!i><yellow>[Astuce]</yellow> <gray>Les triches et modifications non autorisées sont interdites !</gray>"
