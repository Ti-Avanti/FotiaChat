      authors: "<!i><gray>Autoren:<white>{authors}</white>"
      api: "<!i><gray>API-Version:<white>{api}</white>"
      crossserver-enabled: "<!i><gray>Serverübergreifend:<green>Aktiviert</green> <white>({type})</white>"
      crossserver-disabled: "<!i><gray>Serverübergreifend:<red>Deaktiviert</red>"
      footer: "<!i><gradient:#FF6B6B:#4ECDC4>===============================</gradient>"

