configured-announcements:
  welcome:
    border: "<!i><gradient:#FF6B6B:#4ECDC4>========================================</gradient>"
    title: "<!i><white>       서버에 오신 것을 환영합니다!</white>"
    subtitle: "<!i><gray>       즐거운 시간 보내세요!</gray>"
  rules:
    civil: "<!i><yellow>[팁]</yellow> <gray>서버 규칙을 따르고 존중해주세요!</gray>"
    cheating: "<!i><yellow>[팁]</yellow> <gray>부정행위 및 무단수정을 금지합니다!</gray>"
