# FotiaChat 영어 파일

# 메시지 접두사
prefix: "<!i><gradient:#FF6B6B:#4ECDC4>[FotiaChat]</gradient> "

# 일반 메시지
general:
  reload-success: "<!i><green>구성이 성공적으로 다시 로드되었습니다!"
  reload-failed: "<!i><red>구성을 다시 로드하지 못했습니다: {error}"
  no-permission: "<!i><red>이 명령을 실행할 권한이 없습니다!"
  player-only: "<!i><red>이 명령은 플레이어만 실행할 수 있습니다!"
  invalid-args: "<!i><red>잘못된 인수입니다! 사용량: {usage}"
  player-not-found: "<!i><red>플레이어를 찾을 수 없습니다: {player}"
  player-offline: "<!i><red> {player} 플레이어가 온라인 상태가 아닙니다!"

# 채팅 관련 메시지
chat:
  muted: "<!i><red>음소거되어 메시지를 보낼 수 없습니다!"
  mute-expired: "<!i><green>음소거가 만료되었습니다. 이제 메시지를 보낼 수 있습니다!"
  cooldown: "<!i><red>메시지를 너무 빨리 보내는군요! 다시 시도하기 전에 {time} 기다리십시오!"
  empty-message: "<!i><red>빈 메시지를 보낼 수 없습니다!"
  message-too-long: "<!i><red>메시지가 너무 깁니다. 최대 길이: {max}"

# 관리자 명령 메시지
admin:
  mute-success: "<!i><green> {duration}에 대해 {player} 플레이어를 음소거했습니다."
  unmute-success: "<!i><green>음소거 해제된 플레이어 {player}!"
  not-muted: "<!i><yellow>플레이어 {player} 이(가) 음소거되지 않았습니다!"
  clear-chat: "<!i><gray> {player}님이 채팅을 삭제했습니다!"
  mute-exempt: "<!i><red> {player} 플레이어는 음소거 면제를 받았습니다!"
  duration-permanent: "영구"

# 채널 관련 메시지
channel:
  current: "<!i><gray>현재 채널:<white>{channel}</white>"
  switched: "<!i><green>채널로 전환됨:<white>{channel}</white>"
  not-found: "<!i><red>채널을 찾을 수 없습니다: {channel}"
  no-permission: "<!i><red>이 채널을 사용할 권한이 없습니다!"
  list-header: "<!i><gray>사용 가능한 채널:"
  list-item: "<!i><gray>- <white>{channel}</white> ({shortcut})"

# 색상 관련 메시지
color:
  current: "<!i><gray>현재 채팅 색상: {color}"
  help: "<!i><gray>사용량: /chatcolor <colorID|list|reset>"
  set-success: "<!i><green>채팅 색상이 다음으로 설정되었습니다: {color}"
  reset: "<!i><green>채팅 색상이 기본값으로 재설정되었습니다!"
  not-found: "<!i><red>색상을 찾을 수 없음: {color}"
  no-permission: "<!i><red>색상을 사용할 수 있는 권한이 없습니다: {color}"
  list-header: "<!i><gray>========== 사용 가능한 색상 =========="
  list-item: "<!i><gray>- {name} <dark_gray>({id})</dark_gray> {preview}"
  list-footer: "<!i><gray>======================================"
  no-colors-available: "<!i><yellow>사용 가능한 색상이 없습니다!"
  preview-text: "샘플 텍스트"
  select-hover: "<!i><gray>이 색상을 선택하려면 클릭하세요."

# 관련 메시지 필터링
filter:
  blocked: "<!i><red>귀하의 메시지에는 민감한 단어가 포함되어 있어 차단되었습니다!"
  warning: "<!i><yellow>적절한 언어를 사용해주세요!"

# 비공개 메시지 관련 메시지
privatemsg:
  format-sender: "<!i><gray>[<gold>나</gold> -> <white>{target}</white>]</gray> {message}"
  format-receiver: "<!i><gray>[<white>{sender}</white> -> <gold>나</gold>]</gray> {message}"
  self: "<!i><red>자신에게 비공개 메시지를 보낼 수 없습니다!"
  no-reply-target: "<!i><red>답장해줄 사람이 없어!"
  target-offline: "<!i><red>대상 플레이어가 오프라인입니다!"
  target-ignoring: "<!i><red>이 플레이어는 당신을 무시하고 있습니다. 메시지가 전송되지 않았습니다!"
  socialspy-enabled: "<!i><green>소셜 스파이 모드가 활성화되었습니다!"
  socialspy-disabled: "<!i><yellow>소셜 스파이 모드가 비활성화되었습니다!"
  socialspy-format: "<!i><dark_gray>[스파이]<gray>{sender}</gray> -> <gray>{target}</gray>:</dark_gray> {message}"

# 서버 간 통신 메시지
crossserver:
  chat-format: "<!i><dark_gray>[{server}]</dark_gray> <gray>[{channel}]</gray> <white>{player}</white><gray>:</gray> {message}"
  broadcast-format: "<!i><dark_gray>[{server}]</dark_gray> <gold>{message}</gold>"

# 업데이트 확인 메시지
update:
  available: "<!i><gold>새로운 FotiaChat 버전을 사용할 수 있습니다:<white>{latest}</white> <gray>(현재: {current})</gray>"
  release-url: "<!i><gray>릴리스 페이지를 보려면 클릭하세요.<aqua>{url}</aqua>"
  release-hover: "<!i><yellow> GitHub Release 페이지를 열려면 클릭하세요."
  console-available: "새로운 FotiaChat 버전을 사용할 수 있습니다: {latest} (현재: {current}) - {url}"
  console-latest: "FotiaChat 이(가) 최신 상태입니다: {current}"
  console-failed: "FotiaChat 업데이트 확인 실패: {reason}"

# 공지 관련 메시지
announcement:
  sent: "<!i><green>공지 전송됨: {id}"
  not-found: "<!i><red>공지사항을 찾을 수 없습니다: {id}"
  broadcast-success: "<!i><green>메시지가 방송되었습니다!"
  toggle-enabled: "<!i><green>자동 공지가 활성화되었습니다!"
  toggle-disabled: "<!i><yellow>자동 공지가 비활성화되었습니다!"
  reloaded: "<!i><green>공지사항 구성이 다시 로드되었습니다!"
  list-header: "<!i><gray>========== 공지사항 목록 =========="
  list-item: "<!i><gray>- {id} [{status}] (간격: {interval}초)"
  usage-send: "<!i><red>사용량: /announcement send <ID>"
  usage-broadcast: "<!i><red>사용량: /announcement broadcast <message>"
  help-header: "<!i><gray>========== 공지사항 도움말 =========="
  help-send: "<!i><gray>/announcement send <ID> - 특정 공지 보내기"
  help-broadcast: "<!i><gray>/announcement broadcast <message> - 사용자 정의 메시지 방송"
  help-list: "<!i><gray>/announcement list - 모든 공지사항 나열"
  help-toggle: "<!i><gray>/announcement toggle - 자동 공지 전환"
  help-reload: "<!i><gray>/announcement reload - 공지 구성 다시 로드"
  usage-test: "<!i><red>사용법: /announcement test <ID> [플레이어]"
  test-player-required: "<!i><red>콘솔에서는 온라인 플레이어를 지정해야 합니다.</red>"
  help-test: "<!i><gray>/announcement test <ID> [플레이어] - 공지 조건 검사"
  test-header: "<!i><gold>공지 조건 검사:</gold>"
  test-overall-pass: "<!i><green>통과</green>"
  test-overall-fail: "<!i><red>실패</red>"
  test-entry-pass: "<!i><green>[통과]</green>"
  test-entry-fail: "<!i><red>[실패]</red>"
  test-no-conditions: "<!i><gray>이 공지에는 추가 조건이 없습니다.</gray>"
  status-enabled: "활성화됨"
  status-disabled: "장애인"

# 프리미엄 모듈 메시지
premium:
  not-installed: "<!i><red>이 기능을 사용하려면 FotiaChat-Premium 모듈이 설치되어 있어야 합니다!"
  feature-disabled: "<!i><red>{feature} 기능이 활성화되지 않았습니다!"

# 아이템 표시 메시지
item-display:
  no-permission: "<!i><red>항목을 표시할 권한이 없습니다!"
  view-no-permission: "<!i><red>다른 사람의 인벤토리/enderchest을(를) 볼 수 있는 권한이 없습니다!"
  snapshot-expired: "<!i><red>이 스냅샷은 만료되었습니다!"
  inventory-title: "<!i>{player}의 인벤토리"
  enderchest-title: "<!i>{player}의 엔더체스트"

# 관련 메시지 무시
ignore:
  added: "<!i><green>이제 {player}님의 채팅 메시지를 무시하고 있습니다!"
  removed: "<!i><yellow>더 이상 {player}를 무시하지 않습니다!"
  self: "<!i><red>당신은 자신을 무시할 수 없습니다!"
  list-header: "<!i><gray>========== 무시된 플레이어 =========="
  list-item: "<!i><gray>- <white>{player}</white>"
  list-empty: "<!i><yellow>당신은 어떤 플레이어도 무시하지 않습니다!"

mentions:
  display: "<!i><yellow><bold>@{player}</bold></yellow>"
  hover-player: "<!i><gray>플레이어:<white>{player}</white></gray>"
  hover-sender: "<!i><gray>언급한 사람<white>{sender}</white></gray>"

channels:
  common:
    player-display: "<!i><white>{player}</white>"
    player-hover: "<!i><gray>플레이어:<white>%player_name%</white></gray>"
    player-click: "<!i><gray>이 플레이어에게 메시지를 보내려면 클릭하세요.</gray>"
  global:
    name: "글로벌"
    display: "<!i><gray>[<white>글로벌</white>]</gray>"
    hover-name: "<!i><gray>채널:<white>{channel}</white></gray>"
    hover-description: "<!i><gray>서버 전체 공개 채팅</gray>"
  local:
    name: "지역"
    display: "<!i><gray>[<yellow>지역</yellow>]</gray>"
    hover-name: "<!i><yellow>로컬 채널</yellow>"
    hover-description: "<!i><gray>근처 플레이어에게만 표시됩니다.</gray>"
  admin:
    name: "관리자"
    display: "<!i><gray>[<red>관리자</red>]</gray>"
    hover-name: "<!i><red>관리자 채널</red>"
    hover-description: "<!i><gray>관리자만</gray>"
    player-hover: "<!i><gray>관리자:<red>%player_name%</red></gray>"
    player-click: "<!i><gray>플레이어 정보를 보려면 클릭하세요.</gray>"
  help:
    name: "도움말"
    display: "<!i><gray>[<aqua>도움말</aqua>]</gray>"
    hover-name: "<!i><aqua>도움말 채널</aqua>"
    hover-description: "<!i><gray>질문하고 도움을 요청하세요</gray>"
    player-click: "<!i><aqua>이 플레이어를 도우려면 클릭하세요.</aqua>"

colors:
  white: "<!i><white>화이트</white>"
  gray: "<!i><gray>그레이</gray>"
  red: "<!i><red>빨간색</red>"
  green: "<!i><green>녹색</green>"
  blue: "<!i><blue>블루</blue>"
  yellow: "<!i><yellow>노란색</yellow>"
  gold: "<!i><gold>골드</gold>"
  aqua: "<!i><aqua>아쿠아</aqua>"
  light-purple: "<!i><light_purple>핑크</light_purple>"
  sunset: "<!i><gradient:#FF6B6B:#FFE66D>일몰 그라데이션</gradient>"
  ocean: "<!i><gradient:#667eea:#764ba2>오션 그라데이션</gradient>"
  forest: "<!i><gradient:#11998e:#38ef7d>포레스트 그라디언트</gradient>"
  fire: "<!i><gradient:#f12711:#f5af19>불 그라데이션</gradient>"
  ice: "<!i><gradient:#74ebd5:#ACB6E5>얼음 그라데이션</gradient>"
  rainbow: "<!i><rainbow>무지개</rainbow>"

command:
  usage:
    fotiachat: "/fotiachat <reload|help|version>"
    chatignore: "/chatignore <player|list>"
    msg: "/msg <player> <message>"
    reply: "/reply <message>"
    mute: "/mute <player> <duration> [reason]"
    unmute: "/unmute <player>"
  fotiachat:
    help:
      header: "<!i><gradient:#FF6B6B:#4ECDC4>========== FotiaChat 도움말 ==========</gradient>"
      reload: "<!i><gray>/fotiachat reload - 구성 다시 로드"
      help: "<!i><gray>/fotiachat help - 도움말 표시"
      version: "<!i><gray>/fotiachat version - 버전 정보 표시"
