      chatcolor: "<!i><gray>/chatcolor [color] - 채팅 색상 선택"
      msg: "<!i><gray>/msg <player> <message> - 비공개 메시지 보내기"
      reply: "<!i><gray>/reply <message> - 비공개 메시지에 답장"
      mute: "<!i><gray>/mute <player> <duration> [reason] - 플레이어 음소거"
      unmute: "<!i><gray>/unmute <player> - 플레이어 음소거 해제"
      footer: "<!i><gradient:#FF6B6B:#4ECDC4>====================================</gradient>"
    version:
      header: "<!i><gradient:#FF6B6B:#4ECDC4>========== FotiaChat ==========</gradient>"
      version: "<!i><gray>버전:<white>{version}</white>"
      authors: "<!i><gray>저자:<white>{authors}</white>"
      api: "<!i><gray>API 버전:<white>{api}</white>"
      crossserver-enabled: "<!i><gray>서버 간:<green>활성화됨</green> <white>({type})</white>"
      crossserver-disabled: "<!i><gray>서버 간:<red>장애인</red>"
      footer: "<!i><gradient:#FF6B6B:#4ECDC4>===============================</gradient>"

item-gui:
  hand-title: "<!i><aqua>{player}의 아이템</aqua>"
