configured-announcements:
  welcome:
    border: "<!i><gradient:#FF6B6B:#4ECDC4>========================================</gradient>"
    title: "<!i><white>       Bem-vindo ao servidor!</white>"
    subtitle: "<!i><gray>       Divirta-se!</gray>"
  rules:
    civil: "<!i><yellow>[Dica]</yellow> <gray>Por favor, siga as regras do servidor e seja respeitador!</gray>"
    cheating: "<!i><yellow>[Dica]</yellow> <gray>Cheats e modificações não autorizadas são proibidas!</gray>"
    support: "<!i><yellow>[Dica]</yellow> <gray>Contacte um administrador se precisar de ajuda!</gray>"
  vip:
    message: "<!i><gold>[VIP]</gold> <yellow>Obrigado pelo seu apoio! Aproveite os seus benefícios.</yellow>"
    hover-title: "<!i><gold>Benefícios VIP</gold>"
    hover-action: "<!i><gray>Clique para ver detalhes</gray>"
  event:
    title: "<!i><light_purple>★</light_purple> <gradient:#FF6B6B:#FFE66D>Evento por tempo limitado em curso!</gradient> <light_purple>★</light_purple>"
